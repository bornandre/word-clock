name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Kompilieren (Warnungen = Fehler)
        working-directory: c
        run: make CFLAGS_EXTRA=-Werror

      - name: Tests
        working-directory: c
        run: make check

      - name: Wort-Tabelle gegen Buchstabenraster prüfen
        run: python3 tools/check_layout.py

      - name: Python-Syntax prüfen
        run: python3 -m py_compile tools/led_test.py tools/check_layout.py
