# Einstellungen der Wortuhr
# Wird auch von der Webseite geschrieben; piclock übernimmt Änderungen sofort.

# Helligkeit in mA: 0 (aus), 3, 6, 9, 12, 15, 18, 21
brightness = 3

# Nachtmodus: zwischen night_start und night_end mit night_brightness
night_enabled = 0
night_start = 22:00
night_end = 06:30
night_brightness = 3

# WLAN und Setup-Hotspot (wordclock-wifi, nach Änderung: sudo systemctl restart wordclock-wifi)
wifi_interface = wlan0
ap_ssid = WordClock-Setup
ap_channel = 6
# Sekunden, bis ohne WLAN-Verbindung der Hotspot startet
connect_timeout = 60
# Minuten ohne Gerät am Hotspot, bis das WLAN erneut versucht wird
ap_retry_minutes = 10
